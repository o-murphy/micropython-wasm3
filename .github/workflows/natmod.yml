name: natmod

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "wasm3"
      - "src/**"
      - "natmod/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/natmod.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        default: "v1.28.0"
  workflow_call:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        type: string
        default: "v1.28.0"

concurrency:
  # Literal "natmod-" prefix rather than ${{ github.workflow }}: under
  # workflow_call that expression resolves to the *caller's* workflow name,
  # which can silently collide with the caller's own concurrency group.
  group: natmod-${{ github.ref }}
  cancel-in-progress: true

env:
  # A natmod is only loadable by an interpreter with a matching .mpy ABI, and
  # mpy_ld/dynruntime.mk move between releases — so the version is pinned, not
  # floating. v1.28.0 is the latest release tag (v1.29.0 does not exist yet,
  # only v1.29.0-preview).
  MPY_TAG: ${{ inputs.mpy_tag || github.event.inputs.mpy_tag || 'v1.28.0' }}

jobs:
  # ── Build every natmod arch ───────────────────────────────────────────────
  # Cross toolchains come from dynruntime.mk's own CROSS choices (see the note
  # at the top of natmod/Makefile), so the apt packages below are picked to
  # match those exact prefixes.
  #
  # fail-fast is off deliberately: these legs fail for unrelated,
  # toolchain-specific reasons, and one red arch should not hide the state of
  # the other nine.
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Toolchain dispatch per ARCH (apt package / xtensa-lx106 tarball /
        # esp-idf) now lives inside cibuildmp itself (see this repo's own
        # cibuildmp.toml) -- host first, then a pinned download.
        arch: [x64, x86, armv6m, armv7m, armv7emsp, armv7emdp, rv32imc, rv64imc, xtensa, xtensawin]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # x86 is the one arch cibuildmp cannot self-provision (its own
      # docs/BACKLOG.md M2): it is the host gcc's own -m32 mode, not a
      # cross-compile, so no downloadable tarball can supply the missing
      # 32-bit glibc headers/libs the way it does for every other arch here.
      # The old build-natmod composite action installed this internally;
      # cibuildmp does not, so it moves here explicitly -- same as
      # micropython-bclibc's and a7p's own natmod workflows.
      - if: matrix.arch == 'x86'
        run: sudo apt-get update -q && sudo apt-get install -y gcc-multilib

      - uses: ballistics-lab/cibuildmp@9f30109cc178d5f0b5192850f3a78ae6edfe8b48
        with:
          # `build`, not the retired CIBMP_MICROPYTHON/CIBMP_ARCHS env pair
          # (record 0052 dropped both -- there is no more separate
          # `micropython =`/`archs =` config surface, only a `build`/`skip`
          # glob over the real `mpy{abi}-{tag}-{arch}` identifier). `mpy*`
          # leaves the ABI open rather than hardcoding it, so this keeps
          # matching if MPY_TAG ever moves to a tag on a different ABI --
          # (tag, arch) alone is already unique per row in
          # resources/build-platforms.toml.
          build: mpy*-${{ env.MPY_TAG }}-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: wasm3-${{ matrix.arch }}
          path: natmod/build/${{ matrix.arch }}/
          if-no-files-found: error

  # ── Run the suite on the arches this runner can actually execute ──────────
  # x64 and x86 only. Adding an on-target leg (armv7m under QEMU, armv6m under
  # an RP2040 emulator) is the natural next step and is what micropython-bclibc
  # does; it needs a serial/raw-REPL bridge that does not exist in this repo
  # yet, so it is left out rather than committed untested.
  test:
    name: test (${{ matrix.label }})
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            kind: unix
            label: x64 / micropython
          - arch: x86
            kind: unix32
            label: x86 / micropython 32-bit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ballistics-lab/cibuildmp/.github/actions/fetch-micropython@9f30109cc178d5f0b5192850f3a78ae6edfe8b48
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install unix build deps
        if: matrix.kind == 'unix'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install 32-bit build deps
        if: matrix.kind == 'unix32'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib libffi-dev:i386 pkg-config

      # No `make submodules` step. MPY_DIR is the official release tarball,
      # which already ships lib/mbedtls,
      # lib/berkeley-db-1.xx and lib/micropython-lib vendored in; it has no
      # .git, so `git submodule` against it just fails with "did not match
      # any file(s) known to git". ports/unix/README.md says the same thing:
      # the step "can be skipped if you didn't clone the MicroPython source
      # from git".
      - name: Build micropython unix/standard (matches the natmod .mpy version)
        if: matrix.kind == 'unix'
        run: make -C "$MPY_DIR/ports/unix" VARIANT=standard

      - name: Build micropython unix/standard 32-bit
        if: matrix.kind == 'unix32'
        run: make -C "$MPY_DIR/ports/unix" VARIANT=standard MICROPY_FORCE_32BIT=1

      - uses: actions/download-artifact@v8
        with:
          name: wasm3-${{ matrix.arch }}
          path: natmod/build/${{ matrix.arch }}/

      - name: Check the committed wasm fixtures match their generator
        run: |
          python3 tools/make_test_wasm.py
          git diff --exit-code -- tests/wasm

      - name: Run tests
        run: |
          ln -sf ../natmod/build/${{ matrix.arch }}/wasm3.mpy tests/wasm3.mpy
          cd tests && "$MPY_DIR/ports/unix/build-standard/micropython" test_wasm3.py

      - name: Run tests against the wasm2mpy demo blobs
        # Real toolchain output — seven languages plus CoreMark — from the
        # wasm2mpy submodule, rather than the hand-assembled fixtures.
        # --slow adds CoreMark (~20s), which is the only blob here that
        # exercises the interpreter under sustained load.
        run: cd tests && "$MPY_DIR/ports/unix/build-standard/micropython" test_wiring_apps.py --slow

  # ── On real ARM silicon: armv7emsp / armv7emdp on a 32-bit ARM Linux host ─
  # Every other ARM leg here is an emulator -- armv7m under qemu-system-arm
  # below, armv6m under rp2040py after it. This one is not: ubuntu-24.04-arm
  # executes AArch32 on its own CPU (measured -- see usermod.yml's
  # usermod-cross header), so a 32-bit armhf build of ports/unix is a genuine
  # ARM host that can load a Cortex-M natmod .mpy and run the suites against
  # it with no emulation anywhere in the picture.
  #
  # Two things have to line up, and py/dynruntime.mk decides both per ARCH:
  #
  #   1. The .mpy arch check. py/persistentcode.h gives a Thumb-2 host with a
  #      double-precision FPU MPY_FEATURE_ARCH = MP_NATIVE_ARCH_ARMV7EMDP, and
  #      MPY_FEATURE_ARCH_TEST is a *range* -- ARMV6M <= x <= that -- not an
  #      equality. Ubuntu's arm-linux-gnueabihf-gcc defaults to Thumb-2 with
  #      __ARM_FP=12, so every ARM natmod ARCH clears this check. Read back
  #      off the built binary rather than assumed: sys.implementation._mpy >>
  #      10 is 8.
  #
  #   2. The float ABI, which that check does not cover. armv6m and armv7m
  #      get no -mfloat-abi=hard, so their floats cross into the runtime in
  #      core registers while an armhf host reads them from VFP registers per
  #      AAPCS-VFP. Those .mpy files load and then misbehave rather than
  #      failing -- measured on micropython-bclibc's own module, where
  #      find_zero_angle returned 984.252 rad (its range in feet) instead of
  #      0.002502. Silently wrong, never a crash. So they stay on the
  #      emulator legs that run them on the target they are built for.
  #
  # armv7emsp and armv7emdp are both -mfloat-abi=hard and do line up, each
  # against a host built with its own MICROPY_FLOAT_IMPL -- that decides
  # sizeof(mp_float_t) on both sides of the dynruntime call boundary. Both
  # legs were run locally before this job existed: 20/20 then 31/31 on each,
  # CoreMark 94.041 (dp) and 94.738 (sp).
  #
  # Scope: this runs Cortex-M code inside a Linux process. It proves the
  # native module and its relocations are right on real ARM silicon. It does
  # not replace the QEMU leg, which exercises a -nostdlib firmware
  # environment this module has its own libc/math shims for.
  test-arm-linux:
    name: test (${{ matrix.arch }} / 32-bit ARM Linux)
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7emsp
            # dynruntime.mk gives armv7emsp MICROPY_FLOAT_IMPL=float; the unix
            # port defaults to double. mpconfigvariant_common.h guards that
            # default with #ifndef, so a -D on the command line wins. Checked
            # on the resulting binary, not inferred from the flag: print(1/3)
            # gives 0.33333334 rather than 0.3333333333333333.
            host_float: "-DMICROPY_FLOAT_IMPL=MICROPY_FLOAT_IMPL_FLOAT"
          - arch: armv7emdp
            # Already double, which is the unix port's own default.
            host_float: ""
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ballistics-lab/cibuildmp/.github/actions/fetch-micropython@9f30109cc178d5f0b5192850f3a78ae6edfe8b48
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install the armhf cross toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build mpy-cross
        # Explicit, and load-bearing here for a reason specific to this job.
        # py/mkrules.mk auto-builds mpy-cross as a prerequisite of the port
        # build, and CFLAGS_EXTRA leaks into that sub-make through MAKEFLAGS.
        # mpy-cross/mpconfigport.h:77 defines MICROPY_FLOAT_IMPL
        # unconditionally -- no #ifndef, unlike the unix port's
        # mpconfigvariant_common.h -- and mpy-cross compiles -Werror, so the
        # armv7emsp row's -DMICROPY_FLOAT_IMPL=... collided with it:
        #
        #   ./mpconfigport.h:77: error: "MICROPY_FLOAT_IMPL" redefined
        #   <command-line>: note: this is the location of the previous
        #
        # A real failure of the first version of this job. Building mpy-cross
        # here, natively for arm64 and with no CFLAGS_EXTRA in sight, means
        # the binary already exists when the port build looks for it and that
        # auto-build path never runs.
        run: make -C "$MPY_DIR/mpy-cross" -j"$(nproc)"

      - name: Build a 32-bit ARM micropython host
        # MICROPY_PY_FFI=0/MICROPY_PY_BTREE=0: both want target libraries the
        # cross toolchain does not ship (armhf libffi headers in particular),
        # and neither suite touches either module. This host exists only to
        # load a natmod .mpy. usermod.yml's armhf row is where a
        # full-featured static armhf build is actually exercised.
        #
        # LDFLAGS_EXTRA=-static is load-bearing, not a nicety. The runner is
        # arm64: its CPU executes AArch32, but its filesystem has no armhf
        # glibc and no /lib/ld-linux-armhf.so.3, so a dynamically linked
        # armhf binary dies with "cannot execute: required file not found"
        # (exit 127) -- a real failure of the first version of this job. A
        # static link has no interpreter to find. Same reason usermod.yml's
        # armhf row links static.
        run: |
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$GITHUB_WORKSPACE/mpy-host-${{ matrix.arch }}" \
            CROSS_COMPILE=arm-linux-gnueabihf- \
            MICROPY_PY_FFI=0 MICROPY_PY_BTREE=0 \
            CFLAGS_EXTRA="${{ matrix.host_float }}" \
            LDFLAGS_EXTRA="-static" -j"$(nproc)"

      - uses: actions/download-artifact@v8
        with:
          name: wasm3-${{ matrix.arch }}
          path: natmod/build/${{ matrix.arch }}/

      - name: Run tests
        # `file` and the two probes first, so the log carries the evidence
        # rather than this job's comment having to be taken on faith: a
        # 32-bit ARM binary, the arch it advertises to the .mpy loader, and
        # the float width it was built with.
        run: |
          HOST="$GITHUB_WORKSPACE/mpy-host-${{ matrix.arch }}/micropython"
          file "$HOST"
          "$HOST" -c "import sys; print('MPY_FEATURE_ARCH', sys.implementation._mpy >> 10)"
          "$HOST" -c "print('float width probe', 1/3)"
          ln -sf ../natmod/build/${{ matrix.arch }}/wasm3.mpy tests/wasm3.mpy
          cd tests
          "$HOST" test_wasm3.py
          "$HOST" test_wiring_apps.py --slow

  # ── On-target: armv7m under QEMU (Cortex-M3) ─────────────────────────────
  # The first leg that runs the module as something other than x86. natmod/ci/
  # run_qemu.py pushes wasm3.mpy and every .wasm blob over the raw REPL, since
  # the qemu port has no filesystem.
  test-armv7m:
    name: test (armv7m / QEMU Cortex-M3)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ballistics-lab/cibuildmp/.github/actions/fetch-micropython@9f30109cc178d5f0b5192850f3a78ae6edfe8b48
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install QEMU and the ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
          pip install pyelftools ar pyserial

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build QEMU firmware (MPS2_AN385)
        # MICROPY_HEAP_SIZE well above the port's 143360 default: a natmod's
        # text is copied into the GC heap at import, and the armv7m wasm3.mpy
        # is ~82 KB before a single 64 KB wasm page is allocated on top. The
        # port's linker gives RAM 2 MB, so 1 MB is comfortably inside it.
        run: make -C "$MPY_DIR/ports/qemu" BOARD=MPS2_AN385 MICROPY_HEAP_SIZE=1048576

      - uses: actions/download-artifact@v8
        with:
          name: wasm3-armv7m
          path: natmod/build/armv7m/

      - name: Run both suites under QEMU
        run: |
          python3 natmod/ci/run_qemu.py \
            "$MPY_DIR/ports/qemu/build-MPS2_AN385/firmware.elf" \
            natmod/build/armv7m

  # ── On-target: armv6m on an emulated RP2040 ──────────────────────────────
  # QEMU has no board that can load an armv6m natmod, so this uses the
  # rp2040py emulator instead — same approach micropython-bclibc takes.
  #
  # Core suite only. test_wiring_apps.py does not pass on this target, and the
  # reason is native stack depth rather than RAM: measured solo, each blob
  # loads with 40-65 KB of heap still free and then fails on call depth,
  # because M3_HAS_TAIL_CALL=0 costs a native frame per wasm call. See README
  # under Status for the numbers.
  test-armv6m:
    name: test (armv6m / rp2040py)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ballistics-lab/cibuildmp/.github/actions/fetch-micropython@9f30109cc178d5f0b5192850f3a78ae6edfe8b48
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install the ARM toolchain and emulator
        # libstdc++-arm-none-eabi-newlib is not optional here even though
        # nothing in this repo is C++: pico-sdk compiles one .cpp of its own
        # (pico_cxx_options/new_delete.cpp), which fails with "fatal error:
        # cstdlib: No such file or directory" on a runner that has only
        # gcc-arm-none-eabi.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib cmake
          pip install "rp2040py==0.3.1" littlefs-python

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build RPI_PICO firmware
        # Built from the pinned MicroPython rather than letting rp2040py fetch
        # its own default image: that one is a different release, and a natmod
        # only loads on a matching .mpy ABI. pico-sdk ships inside the release
        # tarball, so there is nothing to init.
        run: make -C "$MPY_DIR/ports/rp2" BOARD=RPI_PICO -j"$(nproc)"

      - uses: actions/download-artifact@v8
        with:
          name: wasm3-armv6m
          path: natmod/build/armv6m/

      - name: Run the core suite on the emulator
        run: |
          python3 natmod/ci/run_rp2040py.py \
            "$MPY_DIR/ports/rp2/build-RPI_PICO/firmware.uf2" \
            natmod/build/armv6m
