name: natmod

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "wasm3"
      - "src/**"
      - "natmod/**"
      - "usermod/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/natmod.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        default: "v1.28.0"
  workflow_call:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        type: string
        default: "v1.28.0"

concurrency:
  # Literal "natmod-" prefix rather than ${{ github.workflow }}: under
  # workflow_call that expression resolves to the *caller's* workflow name,
  # which can silently collide with the caller's own concurrency group.
  group: natmod-${{ github.ref }}
  cancel-in-progress: true

env:
  # A natmod is only loadable by an interpreter with a matching .mpy ABI, and
  # mpy_ld/dynruntime.mk move between releases — so the version is pinned, not
  # floating. v1.28.0 is the latest release tag (v1.29.0 does not exist yet,
  # only v1.29.0-preview).
  MPY_TAG: ${{ inputs.mpy_tag || github.event.inputs.mpy_tag || 'v1.28.0' }}

jobs:
  # ── Build every natmod arch ───────────────────────────────────────────────
  # Cross toolchains come from dynruntime.mk's own CROSS choices (see the note
  # at the top of natmod/Makefile), so the apt packages below are picked to
  # match those exact prefixes.
  #
  # fail-fast is off deliberately: these legs fail for unrelated,
  # toolchain-specific reasons, and one red arch should not hide the state of
  # the other nine.
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: x86
            apt: gcc-multilib
          - arch: armv6m
            apt: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - arch: armv7m
            apt: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - arch: armv7emsp
            apt: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - arch: armv7emdp
            apt: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - arch: rv32imc
            apt: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          - arch: rv64imc
            apt: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          # xtensa/xtensawin have no plain apt package — they get their own
          # steps below instead of the generic "Install cross-compiler" one.
          - arch: xtensa
            toolchain: xtensa-lx106
          - arch: xtensawin
            toolchain: esp-idf

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install cross-compiler
        if: matrix.apt != ''
        # apt-get update first: the runner image's baked-in package index can
        # already point at a gcc/glibc revision the mirror has superseded,
        # which shows up as a 404 on install rather than as a version error.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install xtensa (ESP8266) toolchain
        if: matrix.toolchain == 'xtensa-lx106'
        # dynruntime.mk uses xtensa-lx106-elf- for ARCH=xtensa; same tarball
        # MicroPython's own ci_esp8266_setup uses.
        run: |
          wget -q https://micropython.org/resources/xtensa-lx106-elf-standalone.tar.gz
          tar xzf xtensa-lx106-elf-standalone.tar.gz
          echo "$PWD/xtensa-lx106-elf/bin" >> "$GITHUB_PATH"

      - name: Install esp-idf (xtensawin toolchain)
        if: matrix.toolchain == 'esp-idf'
        # Only for the xtensa-esp32-elf- toolchain that install.sh fetches —
        # nothing here builds against esp-idf components, so no
        # `git submodule update` (which is most of that clone's cost).
        env:
          IDF_VER: v5.4
        run: |
          git clone --depth 1 --branch $IDF_VER https://github.com/espressif/esp-idf.git
          ./esp-idf/install.sh
          source esp-idf/export.sh
          echo "$PATH" | tr ':' '\n' | grep -i esp-idf >> "$GITHUB_PATH" || true

      - name: Install Python tools
        run: pip install pyelftools ar

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build ${{ matrix.arch }}
        working-directory: natmod
        # esp-idf's export.sh puts its own venv ahead of the system PATH, so
        # the pyelftools/ar installed above are invisible to the python
        # mpy_ld.py then runs under — reinstall inside that env.
        run: |
          if [ "${{ matrix.toolchain }}" = "esp-idf" ]; then
            source ../esp-idf/export.sh
            pip install pyelftools ar
          fi
          make ARCH=${{ matrix.arch }} MPY_DIR="$MPY_DIR" dist

      - uses: actions/upload-artifact@v4
        with:
          name: wasm3-${{ matrix.arch }}
          path: natmod/build/${{ matrix.arch }}/
          if-no-files-found: error

  # ── Run the suite on the arches this runner can actually execute ──────────
  # x64 and x86 only. Adding an on-target leg (armv7m under QEMU, armv6m under
  # an RP2040 emulator) is the natural next step and is what micropython-bclibc
  # does; it needs a serial/raw-REPL bridge that does not exist in this repo
  # yet, so it is left out rather than committed untested.
  test:
    name: test (${{ matrix.label }})
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            kind: unix
            label: x64 / micropython
          - arch: x86
            kind: unix32
            label: x86 / micropython 32-bit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install unix build deps
        if: matrix.kind == 'unix'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install 32-bit build deps
        if: matrix.kind == 'unix32'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib libffi-dev:i386 pkg-config

      # No `make submodules` step, here or in the usermod job below. MPY_DIR
      # is the official release tarball, which already ships lib/mbedtls,
      # lib/berkeley-db-1.xx and lib/micropython-lib vendored in; it has no
      # .git, so `git submodule` against it just fails with "did not match
      # any file(s) known to git". ports/unix/README.md says the same thing:
      # the step "can be skipped if you didn't clone the MicroPython source
      # from git".
      - name: Build micropython unix/standard (matches the natmod .mpy version)
        if: matrix.kind == 'unix'
        run: make -C "$MPY_DIR/ports/unix" VARIANT=standard

      - name: Build micropython unix/standard 32-bit
        if: matrix.kind == 'unix32'
        run: make -C "$MPY_DIR/ports/unix" VARIANT=standard MICROPY_FORCE_32BIT=1

      - uses: actions/download-artifact@v4
        with:
          name: wasm3-${{ matrix.arch }}
          path: natmod/build/${{ matrix.arch }}/

      - name: Check the committed wasm fixtures match their generator
        run: |
          python3 tools/make_test_wasm.py
          git diff --exit-code -- tests/wasm

      - name: Run tests
        run: |
          ln -sf ../natmod/build/${{ matrix.arch }}/wasm3.mpy tests/wasm3.mpy
          cd tests && "$MPY_DIR/ports/unix/build-standard/micropython" test_wasm3.py

      - name: Run tests against the wasm2mpy demo blobs
        # Real toolchain output — seven languages plus CoreMark — from the
        # wasm2mpy submodule, rather than the hand-assembled fixtures.
        # --slow adds CoreMark (~20s), which is the only blob here that
        # exercises the interpreter under sustained load.
        run: cd tests && "$MPY_DIR/ports/unix/build-standard/micropython" test_wiring_apps.py --slow

  # ── On-target: armv7m under QEMU (Cortex-M3) ─────────────────────────────
  # The first leg that runs the module as something other than x86. natmod/ci/
  # run_qemu.py pushes wasm3.mpy and every .wasm blob over the raw REPL, since
  # the qemu port has no filesystem.
  test-armv7m:
    name: test (armv7m / QEMU Cortex-M3)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install QEMU and the ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
          pip install pyelftools ar pyserial

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build QEMU firmware (MPS2_AN385)
        # MICROPY_HEAP_SIZE well above the port's 143360 default: a natmod's
        # text is copied into the GC heap at import, and the armv7m wasm3.mpy
        # is ~82 KB before a single 64 KB wasm page is allocated on top. The
        # port's linker gives RAM 2 MB, so 1 MB is comfortably inside it.
        run: make -C "$MPY_DIR/ports/qemu" BOARD=MPS2_AN385 MICROPY_HEAP_SIZE=1048576

      - uses: actions/download-artifact@v4
        with:
          name: wasm3-armv7m
          path: natmod/build/armv7m/

      - name: Run both suites under QEMU
        run: |
          python3 natmod/ci/run_qemu.py \
            "$MPY_DIR/ports/qemu/build-MPS2_AN385/firmware.elf" \
            natmod/build/armv7m

  # ── On-target: armv6m on an emulated RP2040 ──────────────────────────────
  # QEMU has no board that can load an armv6m natmod, so this uses the
  # rp2040py emulator instead — same approach micropython-bclibc takes.
  #
  # Core suite only. test_wiring_apps.py does not pass on this target, and the
  # reason is native stack depth rather than RAM: measured solo, each blob
  # loads with 40-65 KB of heap still free and then fails on call depth,
  # because M3_HAS_TAIL_CALL=0 costs a native frame per wasm call. See README
  # under Status for the numbers.
  test-armv6m:
    name: test (armv6m / rp2040py)
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install the ARM toolchain and emulator
        # libstdc++-arm-none-eabi-newlib is not optional here even though
        # nothing in this repo is C++: pico-sdk compiles one .cpp of its own
        # (pico_cxx_options/new_delete.cpp), which fails with "fatal error:
        # cstdlib: No such file or directory" on a runner that has only
        # gcc-arm-none-eabi.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib cmake
          pip install "rp2040py==0.3.1" littlefs-python

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build RPI_PICO firmware
        # Built from the pinned MicroPython rather than letting rp2040py fetch
        # its own default image: that one is a different release, and a natmod
        # only loads on a matching .mpy ABI. pico-sdk ships inside the release
        # tarball, so there is nothing to init.
        run: make -C "$MPY_DIR/ports/rp2" BOARD=RPI_PICO -j"$(nproc)"

      - uses: actions/download-artifact@v4
        with:
          name: wasm3-armv6m
          path: natmod/build/armv6m/

      - name: Run the core suite on the emulator
        run: |
          python3 natmod/ci/run_rp2040py.py \
            "$MPY_DIR/ports/rp2/build-RPI_PICO/firmware.uf2" \
            natmod/build/armv6m

  # ── usermod: the module compiled into firmware rather than loaded as .mpy ──
  # One matrix, one job, each row carrying everything it needs — the shape
  # a7p's mp-usermod.yml uses, rather than a separate job per target.
  #
  # aarch64 is the row that justifies the job existing at all: dynruntime.mk
  # has no aarch64 ARCH, so a natmod cannot reach it by any means, and
  # GitHub's ubuntu-24.04-arm runners are free on public repos and GA since
  # August 2025 — a *native* build, no cross-compiler, no qemu-user, no
  # Docker. The other rows do duplicate what natmod already covers, which
  # a7p's scope policy would exclude; they stay because usermod here links
  # against the port's own libc rather than src/libc_shim.c, and that
  # difference has already produced one real defect (rp2's zero-byte C heap
  # faulting the CPU inside wasm3.Module()).
  usermod:
    name: usermod (${{ matrix.port }}-${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: unix
            arch_label: x64
            runs_on: ubuntu-latest
          - port: unix
            arch_label: x86
            runs_on: ubuntu-latest
            force_32bit: "1"
          - port: unix
            arch_label: aarch64
            runs_on: ubuntu-24.04-arm
          - port: rp2
            arch_label: RPI_PICO
            runs_on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/fetch-micropython
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install unix build deps
        if: matrix.port == 'unix' && matrix.arch_label != 'x86'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install 32-bit build deps
        if: matrix.arch_label == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib libffi-dev:i386 pkg-config

      - name: Install the ARM toolchain and emulator
        if: matrix.port == 'rp2'
        # libstdc++-arm-none-eabi-newlib: pico-sdk compiles one .cpp of its
        # own, which fails with "cstdlib: No such file or directory" without it.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib cmake
          pip install "rp2040py==0.3.1" littlefs-python

      - name: Build mpy-cross
        # Explicitly, before FROZEN_MANIFEST ever appears on a command line —
        # see the note on py/mkenv.mk's auto-build rule in the natmod jobs.
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build usermod firmware (unix)
        if: matrix.port == 'unix'
        run: |
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD=build-wasm3 PROG=micropython-wasm3 \
            MICROPY_FORCE_32BIT=${{ matrix.force_32bit || '0' }} \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            -j"$(nproc)"

      - name: Build usermod firmware (rp2)
        if: matrix.port == 'rp2'
        # Two steps rather than one: ports/rp2/Makefile builds its cmake
        # arguments with `CMAKE_ARGS +=`, so passing CMAKE_ARGS= on the command
        # line replaces the lot — including MICROPY_BOARD, USER_C_MODULES and
        # MICROPY_FROZEN_MANIFEST. Configure normally, then add the one extra
        # define to the existing cache.
        #
        # MICROPY_C_HEAP_SIZE is not optional here: rp2 defaults it to 0, and
        # wasm3 allocates through the port's calloc(). usermod/micropython.cmake
        # fails the configure outright if it is left at 0.
        run: |
          cd "$MPY_DIR/ports/rp2"
          make BOARD=RPI_PICO BUILD=build-wasm3 \
            USER_C_MODULES="$GITHUB_WORKSPACE/usermod/micropython.cmake" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" || true
          cmake -S . -B build-wasm3 -DMICROPY_C_HEAP_SIZE=131072
          make BOARD=RPI_PICO BUILD=build-wasm3 \
            USER_C_MODULES="$GITHUB_WORKSPACE/usermod/micropython.cmake" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            -j"$(nproc)"

      - name: Run tests (unix)
        if: matrix.port == 'unix'
        # No wasm3.mpy in tests/ — it would shadow the frozen wasm3.py.
        run: |
          cd tests
          "$MPY_DIR/ports/unix/build-wasm3/micropython-wasm3" test_wasm3.py
          "$MPY_DIR/ports/unix/build-wasm3/micropython-wasm3" test_wiring_apps.py --slow

      - name: Run tests (rp2, on the emulator)
        if: matrix.port == 'rp2'
        # --no-mpy: the module is in the firmware, so the littlefs image
        # carries only the .wasm blobs. Core suite only, for the same reason
        # the natmod armv6m leg runs only that — see README under Status.
        run: |
          python3 natmod/ci/run_rp2040py.py \
            "$MPY_DIR/ports/rp2/build-wasm3/firmware.uf2" . --no-mpy
