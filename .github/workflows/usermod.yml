name: usermod

# The module compiled into firmware via USER_C_MODULES, rather than loaded at
# runtime as a .mpy -- see natmod.yml for that half, which covers every ARCH
# natmod/Makefile supports.
#
# Its own file rather than a job inside natmod.yml, matching
# micropython-bclibc's usermod.yml and a7p's mp-usermod.yml: the two halves
# share no artifacts and no `needs:`, they are triggered by different paths
# (usermod/ vs natmod/), and they fail for entirely different reasons -- a
# usermod links against the port's own libc, a natmod against src/libc_shim.c.
# Keeping them in one file only meant one red X standing for both.
#
# Scope note: a7p's policy is to build usermod only where natmod *can't*
# reach, which would leave just the aarch64 row here (dynruntime.mk has no
# aarch64 ARCH at all, and GitHub's ubuntu-24.04-arm runners are free on
# public repos and GA since August 2025 -- a native build, no cross-compiler,
# no qemu-user, no Docker). The x64/x86/rp2 rows do duplicate targets natmod
# already covers, and they stay anyway: linking against the port's libc
# instead of the shim is a genuinely different build, and it has already
# produced one real defect that natmod could not have caught (rp2's
# zero-byte C heap faulting the CPU inside wasm3.Module()).
#
# Deliberately no workflow_call trigger: nothing built here -- full
# interpreters and firmware images -- is a distributable artifact, so unlike
# natmod.yml this has no place in a release pipeline. Same call a7p makes.

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "wasm3"
      - "src/**"
      - "usermod/**"
      - "tests/**"
      - "tools/**"
      # The rp2 row drives the emulator with natmod/ci/run_rp2040py.py --
      # one script for both halves rather than a copy per workflow.
      - "natmod/ci/**"
      - ".github/workflows/usermod.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        default: "v1.28.0"

concurrency:
  # Literal "usermod-" prefix rather than ${{ github.workflow }}, for the same
  # reason natmod.yml spells its group out: that expression resolves to the
  # *caller's* workflow name under workflow_call and can collide silently.
  group: usermod-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not floating: a usermod does not carry the .mpy ABI constraint a
  # natmod does, but USER_C_MODULES/py.mk and the rp2 cmake plumbing both move
  # between releases. Bump deliberately, re-running the whole matrix.
  MPY_TAG: ${{ github.event.inputs.mpy_tag || 'v1.28.0' }}
  # cibuildmp resolves/caches its own MicroPython checkout under this path
  # (CIBMP_CACHE_PATH -- src/cibuildmp/sources.py's own cache_root()), one
  # job-workspace-relative directory per run rather than the default
  # ~/.cache/cibuildmp: every job below needs to find the exact build tree
  # cibuildmp itself produced (mpy_dir/ports/<port>/build-<identifier>/...),
  # and a fixed, known root is what makes that path computable without
  # cibuildmp exposing it as an action output -- same convention a7p's own
  # mp-usermod.yml uses. No leading dot: actions/upload-artifact defaults
  # include-hidden-files to false, silently excluding anything under a
  # dot-prefixed directory.
  CIBMP_CACHE_PATH: ${{ github.workspace }}/cibmp-cache

jobs:
  # ── One matrix, one job, each row carrying everything it needs -- the shape
  # a7p's mp-usermod.yml uses, rather than a separate job per target. ────────
  usermod:
    name: build + test (${{ matrix.port }}-${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: unix
            arch_label: x64
            identifier: v1.28.0-manylinux_2_28_x86_64
            runs_on: ubuntu-latest
          - port: unix
            arch_label: x86
            identifier: v1.28.0-manylinux_2_28_i686
            runs_on: ubuntu-latest
          - port: unix
            arch_label: aarch64
            identifier: v1.28.0-manylinux_2_28_aarch64
            runs_on: ubuntu-24.04-arm
          - port: rp2
            arch_label: RPI_PICO
            identifier: v1.28.0-rp2-RPI_PICO
            runs_on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # cibuildmp installs no emulation itself (cibuildwheel's own rule);
      # the job that wants it sets it up. Every leg here only ever builds
      # what its own runner is already native to, so this is defensive
      # rather than load-bearing -- same as cibuildmp's own build-examples.yml
      # applies it uniformly across every usermod job, native legs included.
      - uses: docker/setup-qemu-action@v4

      - name: Install the rp2040py emulator
        if: matrix.port == 'rp2'
        # The arm-none-eabi + CMake toolchain itself is cibuildmp's own
        # concern now (its build_rp2() driver builds inside a pinned Docker
        # image) -- only the emulator, which cibuildmp has no reason to know
        # about, stays here.
        run: pip install "rp2040py==0.3.1" littlefs-python

      - name: Build usermod (${{ matrix.identifier }})
        # MICROPY_C_HEAP_SIZE is usermod/micropython.cmake's own default --
        # see that file's own comment; no PROG override, no config needed for
        # it (see cibuildmp.toml's own comment on why that was tried and
        # dropped). build_dir is ports/<port>/build-<identifier> for unix
        # (build_unix()'s own explicit BUILD= override), but ports/<port>/
        # build-<BOARD> for rp2 -- build_rp2() deliberately passes no BUILD=
        # override at all (its own comment: an explicit one, even set to
        # that exact value, leaks FROZEN_MANIFEST into the port's internal
        # mpy-cross sub-build via MAKEFLAGS), so the Run tests steps below
        # key on whichever this port's driver actually uses.
        uses: ballistics-lab/cibuildmp@v0.4.1
        with:
          build: ${{ matrix.identifier }}

      - name: Run tests (unix)
        if: matrix.port == 'unix'
        # No wasm3.mpy in tests/ -- it would shadow the frozen wasm3.py.
        run: |
          cd tests
          BIN="$CIBMP_CACHE_PATH/micropython/$MPY_TAG/ports/unix/build-${{ matrix.identifier }}/micropython"
          "$BIN" test_wasm3.py
          "$BIN" test_wiring_apps.py --slow

      - name: Run tests (rp2, on the emulator)
        if: matrix.port == 'rp2'
        # --no-mpy: the module is in the firmware, so the littlefs image
        # carries only the .wasm blobs. Core suite only, for the same reason
        # the natmod armv6m leg runs only that -- see README under Status.
        # build-RPI_PICO, not build-<identifier>: see this step's own Build
        # usermod comment above.
        run: |
          python3 natmod/ci/run_rp2040py.py \
            "$CIBMP_CACHE_PATH/micropython/$MPY_TAG/ports/rp2/build-RPI_PICO/firmware.uf2" . --no-mpy

  # ── Cross-built unix: armhf on real hardware, mipsel under qemu-user ──────
  # Its own job rather than two more rows in the matrix above, because the
  # recipe genuinely differs: a static link and libffi built from source as a
  # separate `deplibs` pass. a7p splits these out the same way, for the same
  # reason.
  #
  # Both are natmod-unreachable in the same sense aarch64 is: dynruntime.mk's
  # arm ARCHes are bare-metal EABI, not the Linux ABI, and there is no mips
  # ARCH at all. So this is the case the usermod half exists for, not a
  # duplicate of natmod coverage.
  #
  # armhf no longer runs under qemu. The probe job that used to live at the
  # bottom of this file measured it directly: a statically linked, freestanding
  # AArch32 binary executes on ubuntu-24.04-arm with no emulation and no
  # binfmt handler ("RESULT: AArch32 IS supported on this runner", usermod run
  # #18). So the arm64 runner cross-builds the 32-bit binary and then runs it
  # on its own CPU -- a real execution test on real hardware, where before it
  # was an interpreter's opinion of one. mipsel keeps qemu-user: GitHub has no
  # mips runner and never will.
  #
  # That move is also why armhf switched from gnueabi to gnueabihf, departing
  # from upstream's own tools/ci.sh (ci_unix_qemu_arm_* uses gnueabi). Under
  # qemu the ABI choice is nearly free -- the emulator implements whatever
  # ARMv5 needs. On real ARMv8 hardware it is not: gnueabi is soft-float and
  # baselines at ARMv5TE, whose SWP/SWPB atomics were *removed* in ARMv8 and
  # survive only through the kernel's opt-in ARMV8_DEPRECATED emulation. The
  # probe binary was built with gnueabihf, so that is the toolchain actually
  # proven here; it is also what "armhf" has always named in this matrix, so
  # the row is now honest about what it builds. mipsel is untouched.
  # armhf split off into its own job (unified CLI, below): unlike mipsel it
  # is not a cross-compile any more (manylinux_2_31_armv7l is native to
  # ubuntu-24.04-arm, record 0044) and cibuildmp.toml's own override now
  # carries the static-link flag directly, so it no longer shares a recipe
  # with mipsel at all -- see that job's own header for why it stays on the
  # old composite action.
  usermod-armhf:
    name: build + test (unix-armhf, static)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build usermod (v1.28.0-manylinux_2_31_armv7l)
        # Static via cibuildmp.toml's own [override."v1.28.0-manylinux_2_31_armv7l"]
        # (LDFLAGS_EXTRA=-static) rather than the old composite action's
        # MICROPY_STANDALONE=1/deplibs path -- see that override's own
        # comment: confirmed live (usermod run #58) that manylinux_2_31_armv7l's
        # own libc6-dev/libffi-dev already ship what a plain -static link
        # needs, no vendored libffi build required.
        uses: ballistics-lab/cibuildmp@v0.4.1
        with:
          build: v1.28.0-manylinux_2_31_armv7l

      - name: Run tests
        # No qemu/RUN prefix: the 32-bit binary executes directly on this
        # arm64 runner (record 0044), same as the old job's own armhf row.
        # `file` is printed first so the log records whether the link
        # actually came out static.
        run: |
          cd tests
          BIN="$CIBMP_CACHE_PATH/micropython/$MPY_TAG/ports/unix/build-v1.28.0-manylinux_2_31_armv7l/micropython"
          file "$BIN"
          "$BIN" test_wasm3.py
          "$BIN" test_wiring_apps.py --slow

  # mipsel keeps its own job -- GitHub has no mips runner, so this is still a
  # genuine cross-compile (unlike armhf above) and it needs a qemu-user
  # binary no other row does -- but it is on the cibuildmp CLI like every
  # other row now, not the `build-usermod-unix` composite action. That layer
  # never invokes cibuildmp at all and is a permanent legacy fallback rather
  # than a second supported integration path (cibuildmp record 0073); this
  # job and natmod.yml's four `fetch-micropython` uses were the last things
  # here still reaching into it.
  #
  # What used to justify holding this row back was record 0043 keeping mipsel
  # on the vendored MICROPY_STANDALONE=1/deplibs static-libffi path ("no
  # cross-usable libffi was available", build_unix.py's own
  # UNIX_ARCH_SETTINGS). That is an argument the other way round: cibuildmp's
  # own mipsel driver applies that path itself, gated per-arch in that same
  # source, so the CLI produces the identical static binary this job wants --
  # and -static here is a deployability requirement, not a CI convenience
  # (the target is minimal embedded Linux boards with no assumable
  # ld.so/libc; micropython/micropython#17456). Verified on the real artifact
  # rather than inferred, in o-murphy/a7p's own already-migrated mipsel job:
  # `ELF 32-bit LSB executable, MIPS, MIPS32 rel2 ..., statically linked`,
  # with the libffi deplibs step visible in its build log.
  usermod-mipsel:
    name: build + test (unix-mipsel, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install qemu-user-static
        # What the composite action did for this arch. The apt package, not
        # docker/setup-qemu-action: "Run tests" below needs the
        # `qemu-mipsel-static` binary on PATH to invoke explicitly, which a
        # container-scoped binfmt registration does not provide at all.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-user-static

      - name: Build usermod (${{ env.MPY_TAG }}-manylinux_2_39_mipsel)
        uses: ballistics-lab/cibuildmp@v0.4.1
        with:
          build: ${{ env.MPY_TAG }}-manylinux_2_39_mipsel

      - name: Run tests
        # `qemu-mipsel-static` invoked explicitly rather than relying on the
        # binfmt_misc registration the apt package also installs -- unchanged
        # from this job's own previous recipe, so it still does not depend on
        # the runner image having that registration.
        #
        # cibuildmp's collected copy, not the port's internal build tree: an
        # identifier-qualified name, and the directory record 0070 made carry
        # a binary's repaired lib/ sidecar where one is needed (not here --
        # this link is static).
        run: |
          cd tests
          BIN="$GITHUB_WORKSPACE/mpyhouse/$MPY_TAG-manylinux_2_39_mipsel/micropython-$MPY_TAG-manylinux_2_39_mipsel"
          file "$BIN"
          qemu-mipsel-static "$BIN" test_wasm3.py
          qemu-mipsel-static "$BIN" test_wiring_apps.py --slow

  # ── Windows, build (Linux, cross-compiled) ────────────────────────────────
  # The one target where natmod is not merely absent but impossible for a
  # reason in the port's own config: ports/windows/mpconfigport.h sets
  # MICROPY_EMIT_X64 (0), and py/persistentcode.c gates native .mpy loading
  # on MICROPY_EMIT_MACHINE_CODE (= MICROPY_EMIT_NATIVE || _INLINE_ASM). So a
  # wasm3.mpy cannot be loaded there at all, whatever its arch — usermod is
  # the only way this module runs on Windows.
  #
  # All three arches now come out of cibuildmp's own `windows` usermod driver
  # -- one Docker image, cross-compiling (x86/x64 via apt's mingw-w64 gcc,
  # arm64 via llvm-mingw), the same recipe upstream MicroPython's own
  # build-mingw CI job uses. No Windows runner, no MSYS2, no hand-written
  # combined-manifest step, and -- the whole reason arm64's own -Wno-error
  # workaround (this job's own previous MSYS2/CLANGARM64 incarnation) is gone
  # too -- no clang: cibuildmp's own image cross-compiles arm64 with
  # llvm-mingw's own gcc-compatible driver, not MSYS2's plain clang, so
  # ports/windows/Makefile's gcc-tuned -Werror set never meets a compiler it
  # wasn't written for in the first place. a7p's own mp-usermod.yml already
  # builds all three win* identifiers this way with no such override, which
  # is the live confirmation this job leans on rather than assuming afresh.
  usermod-windows-build:
    name: build (windows-${{ matrix.arch_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86
            identifier: v1.28.0-win32
          - arch_label: x64
            identifier: v1.28.0-win_amd64
          - arch_label: arm64
            identifier: v1.28.0-win_arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v4

      - name: Build usermod (${{ matrix.identifier }})
        uses: ballistics-lab/cibuildmp@v0.4.1
        with:
          build: ${{ matrix.identifier }}

      - uses: actions/upload-artifact@v7
        with:
          name: wasm3-usermod-windows-${{ matrix.arch_label }}
          path: ${{ env.CIBMP_CACHE_PATH }}/micropython/${{ env.MPY_TAG }}/ports/windows/build-${{ matrix.identifier }}/micropython.exe
          if-no-files-found: error

  # ── Windows, run (real Windows hosts) ─────────────────────────────────────
  # A cross-built PE binary still needs a real Windows host to execute --
  # x86/x64 on windows-latest (a real x64 box, WOW64 covers the 32-bit case),
  # arm64 on windows-11-arm. Not an MSYS2 binary any more (build_windows()'s
  # own cross-compiled output, not linked against an MSYS2 runtime), so it
  # runs directly from PowerShell -- same as a7p's own usermod-windows-test.
  usermod-windows-test:
    name: test (windows-${{ matrix.arch_label }})
    needs: usermod-windows-build
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: x86
            runs_on: windows-latest
          - arch_label: x64
            runs_on: windows-latest
          - arch_label: arm64
            runs_on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: wasm3-usermod-windows-${{ matrix.arch_label }}
          path: build

      - name: Run tests (windows-${{ matrix.arch_label }})
        # cd tests first: test_wasm3.py/test_wiring_apps.py's own read()
        # opens fixtures (wasm/add.wasm etc.) by a path relative to CWD, not
        # to the script -- same reason the unix/mipsel jobs cd there too.
        # Live-caught here without it: OSError ENOENT on every fixture.
        run: |
          cd tests
          ..\build\micropython.exe test_wasm3.py
          ..\build\micropython.exe test_wiring_apps.py --slow

  # ── ports/webassembly: wasm3 compiled to wasm, run under node ─────────────
  # natmod cannot reach this port either — dynruntime.mk has no WASM ARCH, and
  # the mechanism is architecturally different anyway. So, like aarch64,
  # armhf, mipsel and Windows, this is a target usermod is the only route to.
  #
  # It is also the odd one conceptually: an interpreter for wasm, itself
  # compiled to wasm. That is a real configuration — wasm3 upstream supports
  # it — and it turns out to work here unmodified, so it stays as a genuine
  # portability datapoint rather than a curiosity: 32-bit target, a libc that
  # is neither glibc nor newlib, and no filesystem at all.
  usermod-wasm:
    name: build + test (webassembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Write combined FROZEN_MANIFEST
        # usermod/manifest.py's own try/except only ever probes
        # $(PORT_DIR)/boards/manifest.py -- a no-op here, since
        # ports/webassembly has no boards/, only variants/. That silently
        # drops pyscript's real default (variants/pyscript/manifest.py):
        # asyncio (JS-scheduler backed) plus a require() list of 24
        # stdlib/utility modules (base64, collections, gzip, os, pathlib,
        # unittest, zlib, ...). Neither test_wasm3.py nor
        # test_wiring_apps.py imports any of them, which is why this went
        # unnoticed in CI -- but the .mjs/.wasm this job uploads is a real
        # build artifact, not just a test fixture, and anyone importing
        # asyncio/os/etc. against it would hit a plain ImportError. Combine
        # explicitly instead, same pattern a7p's own webassembly job used
        # for this exact port before it moved onto the unified CLI.
        #
        # Written into usermod/ (under $GITHUB_WORKSPACE, not $RUNNER_TEMP)
        # now: the unified action has no per-invocation frozen_manifest
        # input any more, only what cibuildmp.toml's own `manifest`/
        # [override] says, so this has to be a real file cibuildmp resolves
        # relative to package-dir (see [override."v1.28.0-wasm32"]) -- and
        # it needs to sit where usermod_mounts() already bind-mounts
        # (inside usermod/, alongside manifest.py itself), not some other
        # runner-only path the container never sees. .gitignore'd, not
        # committed -- generated fresh every run.
        run: |
          cat > usermod/wasm_manifest.py <<EOF
          include("\$(PORT_DIR)/variants/pyscript/manifest.py")
          include("$GITHUB_WORKSPACE/usermod/manifest.py")
          EOF
          cat usermod/wasm_manifest.py

      - name: Build usermod (v1.28.0-wasm32)
        uses: ballistics-lab/cibuildmp@v0.4.1
        with:
          build: v1.28.0-wasm32

      - name: Run both suites under node
        # Via natmod/ci/run_wasm.py rather than `node micropython.mjs
        # test_wasm3.py` directly: this port gives the interpreter no
        # filesystem, so open() raises OSError 44 for every blob even though
        # node itself read the script off the host. The runner prepends them
        # through the same _INJECTED hook the QEMU runner uses.
        run: |
          MJS="$CIBMP_CACHE_PATH/micropython/$MPY_TAG/ports/webassembly/build-v1.28.0-wasm32/micropython.mjs"
          python3 natmod/ci/run_wasm.py "$MJS" test_wasm3.py
          python3 natmod/ci/run_wasm.py "$MJS" test_wiring_apps.py --slow

      - uses: actions/upload-artifact@v7
        with:
          name: wasm3-usermod-webassembly
          path: |
            ${{ env.CIBMP_CACHE_PATH }}/micropython/${{ env.MPY_TAG }}/ports/webassembly/build-v1.28.0-wasm32/micropython.mjs
            ${{ env.CIBMP_CACHE_PATH }}/micropython/${{ env.MPY_TAG }}/ports/webassembly/build-v1.28.0-wasm32/micropython.wasm
          if-no-files-found: error

  # ── ESP32, build-only ────────────────────────────────────────────────────
  # This target was written off in README as "attempted and abandoned",
  # because the ESP-IDF component registry was unreachable from the
  # environment this repo is developed in -- dl.espressif.com and
  # components-file.espressif.com were both refused by its egress policy, and
  # espressif/mdns and espressif/lan867x are real dependencies of the port for
  # target esp32, vendored in neither the release tarball nor esp-idf itself.
  # That was always a statement about one machine rather than about the
  # target, which is why this job was written CI-first and green on the second
  # attempt. Both hosts have since been allowed, so anything further here can
  # be reproduced locally before pushing, the way everything else in this
  # workflow is.
  #
  # Build-only, and not as a shortcut: there is no esp32 emulator to hand a
  # firmware image to the way rp2040py takes an RP2040 .uf2 or qemu-system-arm
  # takes a Cortex-M3 .elf. It proves wasm3 compiles and links into a real
  # esp32 firmware under a compiler, libc and config unlike anything else
  # here. It proves nothing runs.
  #
  # The genuinely open question is size rather than portability. wasm3 is an
  # interpreter, not a leaf module, and a usermod goes into the firmware
  # image -- so this is the first target where the port's flash and IRAM
  # budget is a real constraint on it rather than a footnote. A red result
  # here is informative either way.
  #
  # IDF v5.5.1 is what ports/esp32/README.md names as recommended for this
  # MicroPython release (5.3, 5.4, 5.4.1 and 5.4.2 also supported).
  # BOARD=ESP32_GENERIC is the mainstream target, and the xtensawin one that
  # natmod.yml already builds a .mpy for.
  usermod-esp32:
    name: build (esp32 / ESP32_GENERIC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build usermod (v1.28.0-esp32-ESP32_GENERIC)
        # cibuildmp's own esp32 driver resolves idf_version/idf_target from
        # resources/build-platforms.toml itself (v5.5.1 for
        # v1.28.0-ESP32_GENERIC, matching what this job used to hardcode),
        # clones ESP-IDF on the host and runs the actual build inside its own
        # Docker image -- no separate ESP-IDF-install step needed any more.
        # Same identifier a7p's own mp-usermod.yml already builds this way.
        uses: ballistics-lab/cibuildmp@v0.4.1
        with:
          build: v1.28.0-esp32-ESP32_GENERIC

      - uses: actions/upload-artifact@v7
        with:
          name: wasm3-usermod-esp32
          path: |
            ${{ env.CIBMP_CACHE_PATH }}/micropython/${{ env.MPY_TAG }}/ports/esp32/build-ESP32_GENERIC/micropython.bin
            ${{ env.CIBMP_CACHE_PATH }}/micropython/${{ env.MPY_TAG }}/ports/esp32/build-ESP32_GENERIC/firmware.bin
          if-no-files-found: error
