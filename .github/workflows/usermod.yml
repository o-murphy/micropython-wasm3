name: usermod

# The module compiled into firmware via USER_C_MODULES, rather than loaded at
# runtime as a .mpy -- see natmod.yml for that half, which covers every ARCH
# natmod/Makefile supports.
#
# Its own file rather than a job inside natmod.yml, matching
# micropython-bclibc's usermod.yml and a7p's mp-usermod.yml: the two halves
# share no artifacts and no `needs:`, they are triggered by different paths
# (usermod/ vs natmod/), and they fail for entirely different reasons -- a
# usermod links against the port's own libc, a natmod against src/libc_shim.c.
# Keeping them in one file only meant one red X standing for both.
#
# Scope note: a7p's policy is to build usermod only where natmod *can't*
# reach, which would leave just the aarch64 row here (dynruntime.mk has no
# aarch64 ARCH at all, and GitHub's ubuntu-24.04-arm runners are free on
# public repos and GA since August 2025 -- a native build, no cross-compiler,
# no qemu-user, no Docker). The x64/x86/rp2 rows do duplicate targets natmod
# already covers, and they stay anyway: linking against the port's libc
# instead of the shim is a genuinely different build, and it has already
# produced one real defect that natmod could not have caught (rp2's
# zero-byte C heap faulting the CPU inside wasm3.Module()).
#
# Deliberately no workflow_call trigger: nothing built here -- full
# interpreters and firmware images -- is a distributable artifact, so unlike
# natmod.yml this has no place in a release pipeline. Same call a7p makes.

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "wasm3"
      - "src/**"
      - "usermod/**"
      - "tests/**"
      - "tools/**"
      # The rp2 row drives the emulator with natmod/ci/run_rp2040py.py --
      # one script for both halves rather than a copy per workflow.
      - "natmod/ci/**"
      - ".github/workflows/usermod.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      mpy_tag:
        description: "MicroPython release tag (e.g. v1.28.0)"
        required: false
        default: "v1.28.0"

concurrency:
  # Literal "usermod-" prefix rather than ${{ github.workflow }}, for the same
  # reason natmod.yml spells its group out: that expression resolves to the
  # *caller's* workflow name under workflow_call and can collide silently.
  group: usermod-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not floating: a usermod does not carry the .mpy ABI constraint a
  # natmod does, but USER_C_MODULES/py.mk and the rp2 cmake plumbing both move
  # between releases. Bump deliberately, re-running the whole matrix.
  MPY_TAG: ${{ github.event.inputs.mpy_tag || 'v1.28.0' }}

jobs:
  # ── One matrix, one job, each row carrying everything it needs -- the shape
  # a7p's mp-usermod.yml uses, rather than a separate job per target. ────────
  usermod:
    name: build + test (${{ matrix.port }}-${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - port: unix
            arch_label: x64
            runs_on: ubuntu-latest
          - port: unix
            arch_label: x86
            runs_on: ubuntu-latest
            force_32bit: "1"
          - port: unix
            arch_label: aarch64
            runs_on: ubuntu-24.04-arm
          - port: rp2
            arch_label: RPI_PICO
            runs_on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ballistics-lab/micropython-native-ci/.github/actions/fetch-micropython@main
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install unix build deps
        if: matrix.port == 'unix' && matrix.arch_label != 'x86'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libffi-dev pkg-config

      - name: Install 32-bit build deps
        if: matrix.arch_label == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib libffi-dev:i386 pkg-config

      - name: Install the ARM toolchain and emulator
        if: matrix.port == 'rp2'
        # libstdc++-arm-none-eabi-newlib: pico-sdk compiles one .cpp of its
        # own, which fails with "cstdlib: No such file or directory" without it.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib cmake
          pip install "rp2040py==0.3.1" littlefs-python

      - name: Build mpy-cross
        # Explicitly, before FROZEN_MANIFEST ever appears on a command line --
        # py/mkenv.mk's auto-build rule for it races under -j.
        run: make -C "$MPY_DIR/mpy-cross"

      # No `make submodules` step: MPY_DIR is the official release tarball,
      # which already ships lib/mbedtls, lib/berkeley-db-1.xx and
      # lib/micropython-lib vendored in and has no .git, so `git submodule`
      # against it just fails. ports/unix/README.md says the same -- the step
      # "can be skipped if you didn't clone the MicroPython source from git".
      - name: Build usermod firmware (unix)
        if: matrix.port == 'unix'
        run: |
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD=build-wasm3 PROG=micropython-wasm3 \
            MICROPY_FORCE_32BIT=${{ matrix.force_32bit || '0' }} \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            -j"$(nproc)"

      - name: Build usermod firmware (rp2)
        if: matrix.port == 'rp2'
        # Two steps rather than one: ports/rp2/Makefile builds its cmake
        # arguments with `CMAKE_ARGS +=`, so passing CMAKE_ARGS= on the command
        # line replaces the lot -- including MICROPY_BOARD, USER_C_MODULES and
        # MICROPY_FROZEN_MANIFEST. Configure normally, then add the one extra
        # define to the existing cache.
        #
        # MICROPY_C_HEAP_SIZE is not optional here: rp2 defaults it to 0, and
        # wasm3 allocates through the port's calloc(). usermod/micropython.cmake
        # fails the configure outright if it is left at 0.
        run: |
          cd "$MPY_DIR/ports/rp2"
          make BOARD=RPI_PICO BUILD=build-wasm3 \
            USER_C_MODULES="$GITHUB_WORKSPACE/usermod/micropython.cmake" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" || true
          cmake -S . -B build-wasm3 -DMICROPY_C_HEAP_SIZE=131072
          make BOARD=RPI_PICO BUILD=build-wasm3 \
            USER_C_MODULES="$GITHUB_WORKSPACE/usermod/micropython.cmake" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            -j"$(nproc)"

      - name: Run tests (unix)
        if: matrix.port == 'unix'
        # No wasm3.mpy in tests/ -- it would shadow the frozen wasm3.py.
        run: |
          cd tests
          "$MPY_DIR/ports/unix/build-wasm3/micropython-wasm3" test_wasm3.py
          "$MPY_DIR/ports/unix/build-wasm3/micropython-wasm3" test_wiring_apps.py --slow

      - name: Run tests (rp2, on the emulator)
        if: matrix.port == 'rp2'
        # --no-mpy: the module is in the firmware, so the littlefs image
        # carries only the .wasm blobs. Core suite only, for the same reason
        # the natmod armv6m leg runs only that -- see README under Status.
        run: |
          python3 natmod/ci/run_rp2040py.py \
            "$MPY_DIR/ports/rp2/build-wasm3/firmware.uf2" . --no-mpy

  # ── Cross-built unix: armhf on real hardware, mipsel under qemu-user ──────
  # Its own job rather than two more rows in the matrix above, because the
  # recipe genuinely differs: a static link and libffi built from source as a
  # separate `deplibs` pass. a7p splits these out the same way, for the same
  # reason.
  #
  # Both are natmod-unreachable in the same sense aarch64 is: dynruntime.mk's
  # arm ARCHes are bare-metal EABI, not the Linux ABI, and there is no mips
  # ARCH at all. So this is the case the usermod half exists for, not a
  # duplicate of natmod coverage.
  #
  # armhf no longer runs under qemu. The probe job that used to live at the
  # bottom of this file measured it directly: a statically linked, freestanding
  # AArch32 binary executes on ubuntu-24.04-arm with no emulation and no
  # binfmt handler ("RESULT: AArch32 IS supported on this runner", usermod run
  # #18). So the arm64 runner cross-builds the 32-bit binary and then runs it
  # on its own CPU -- a real execution test on real hardware, where before it
  # was an interpreter's opinion of one. mipsel keeps qemu-user: GitHub has no
  # mips runner and never will.
  #
  # That move is also why armhf switched from gnueabi to gnueabihf, departing
  # from upstream's own tools/ci.sh (ci_unix_qemu_arm_* uses gnueabi). Under
  # qemu the ABI choice is nearly free -- the emulator implements whatever
  # ARMv5 needs. On real ARMv8 hardware it is not: gnueabi is soft-float and
  # baselines at ARMv5TE, whose SWP/SWPB atomics were *removed* in ARMv8 and
  # survive only through the kernel's opt-in ARMV8_DEPRECATED emulation. The
  # probe binary was built with gnueabihf, so that is the toolchain actually
  # proven here; it is also what "armhf" has always named in this matrix, so
  # the row is now honest about what it builds. mipsel is untouched.
  usermod-cross:
    name: build + test (unix-${{ matrix.arch }}, static)
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armhf
            runs_on: ubuntu-24.04-arm
            cross_compile: arm-linux-gnueabihf-
            apt: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            qemu_bin: ""
          - arch: mipsel
            runs_on: ubuntu-latest
            cross_compile: mipsel-linux-gnu-
            apt: gcc-mipsel-linux-gnu g++-mipsel-linux-gnu libc6-mipsel-cross qemu-user-static
            qemu_bin: qemu-mipsel-static

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ballistics-lab/micropython-native-ci/.github/actions/fetch-micropython@main
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install the cross toolchain
        # autoconf/libtool/libtool-bin/libltdl-dev are for MICROPY_STANDALONE=1's
        # own autotools build of lib/libffi. No libffi-dev: the point of
        # STANDALONE is to build a static libffi.a for the *target*, which the
        # host's libffi-dev cannot provide.
        #
        # qemu-user-static rides in matrix.apt for mipsel only -- armhf runs on
        # the runner's own CPU now, so installing an emulator there would be
        # dead weight that also hides a genuine failure to execute.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.apt }} \
            autoconf libtool libtool-bin libltdl-dev pkg-config

      - name: Check qemu-user
        if: matrix.qemu_bin != ''
        run: ${{ matrix.qemu_bin }} --version

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build libffi for ${{ matrix.arch }}
        # MICROPY_STANDALONE=1 makes libffi a DEPLIBS entry, not a prerequisite
        # of the default target, so `deplibs` has to run as its own pass. BUILD
        # must match the next step's: deplibs writes libffi.a under
        # $(BUILD)/lib/libffi/out/lib and the main build looks for it there.
        #
        # BUILD stays a shell local rather than job env — py/mkenv.mk has
        # `BUILD ?= build`, so an inherited BUILD would also reroot the
        # mpy-cross build above.
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/${{ matrix.arch }}"
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$BUILD" CROSS_COMPILE=${{ matrix.cross_compile }} \
            MICROPY_STANDALONE=1 deplibs

      - name: Build usermod firmware (${{ matrix.arch }}, static)
        # -static is a deployability requirement, not a CI convenience: these
        # targets are minimal embedded Linux boards that cannot be assumed to
        # have a matching ld.so/libc. Same reasoning as
        # micropython/micropython#17456.
        run: |
          BUILD="$GITHUB_WORKSPACE/usermod/build/${{ matrix.arch }}"
          make -C "$MPY_DIR/ports/unix" VARIANT=standard \
            BUILD="$BUILD" CROSS_COMPILE=${{ matrix.cross_compile }} \
            MICROPY_STANDALONE=1 LDFLAGS_EXTRA="-static" \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            -j"$(nproc)"

      - name: Run tests
        # RUN is empty for armhf -- the 32-bit binary executes directly on the
        # arm64 runner, which is the whole point of the move. For mipsel it is
        # the qemu-user binary, invoked explicitly rather than relying on
        # qemu-user-static's binfmt_misc handler, so the job does not depend on
        # the runner image having that registration. Unquoted on purpose: an
        # empty RUN has to vanish from the command line, not become an empty
        # argv[0].
        run: |
          cd tests
          BIN="$GITHUB_WORKSPACE/usermod/build/${{ matrix.arch }}/micropython"
          RUN="${{ matrix.qemu_bin }}"
          file "$BIN"
          $RUN "$BIN" test_wasm3.py
          $RUN "$BIN" test_wiring_apps.py --slow

  # ── Windows, built and run natively on GitHub's own Windows runners ──────
  # The one target where natmod is not merely absent but impossible for a
  # reason in the port's own config: ports/windows/mpconfigport.h sets
  # MICROPY_EMIT_X64 (0), and py/persistentcode.c gates native .mpy loading
  # on MICROPY_EMIT_MACHINE_CODE (= MICROPY_EMIT_NATIVE || _INLINE_ASM). So a
  # wasm3.mpy cannot be loaded there at all, whatever its arch — usermod is
  # the only way this module runs on Windows.
  #
  # x64 and x86 use MSYS2's plain MINGW64/MINGW32 environments and their
  # unprefixed gcc — the same recipe upstream MicroPython's own build-mingw
  # job uses (.github/workflows/ports_windows.yml). windows-latest is a real
  # x64 box, so the 32-bit build runs there natively through WOW64.
  #
  # arm64 is on windows-11-arm via MSYS2's CLANGARM64. Upstream does not test
  # Windows ARM64, so there is no proven recipe — but a7p's mp-usermod.yml
  # recorded, in comments, every failure it hit before dropping that row, and
  # the overrides below come from there rather than from guessing. See the
  # note on each one.
  usermod-windows:
    name: build + test (windows-${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs_on: windows-latest
            msystem: MINGW64
            msys_install: mingw-w64-x86_64-gcc
            cflags_extra: ""
          - arch: x86
            runs_on: windows-latest
            msystem: MINGW32
            msys_install: mingw-w64-i686-gcc
            cflags_extra: ""
          - arch: arm64
            runs_on: windows-11-arm
            msystem: CLANGARM64
            msys_install: mingw-w64-clang-aarch64-gcc-compat mingw-w64-clang-aarch64-clang
            # MSYS2 ships no gcc for ARM64 Windows, so this row is clang,
            # and ports/windows/Makefile:42 compiles -Werror with a warning
            # set chosen for gcc. MicroPython's own sources do not survive
            # that combination — upstream has evidently never built this
            # port with clang. Three distinct classes hit so far, all in
            # MPY_DIR, none fixable from this repo:
            #
            #   py/binary.c:165                 _Float16 -> float
            #                                   [-Wdouble-promotion]
            #   shared/runtime/gchelper_generic.c:136-146
            #                                   [-Wdefault-const-init-var-unsafe]
            #   shared/runtime/gchelper_generic.c:147-154
            #                                   [-Wuninitialized]
            #
            # The gchelper ones are not even bugs: that file declares
            # uninitialized `register const long x19 asm("x19")` and friends
            # precisely to capture the callee-saved registers for GC root
            # scanning.
            #
            # -Wno-error rather than a growing list of -Wno-<name>:
            # enumerating them one CI round-trip at a time is what made a7p
            # abandon this target, and -Wno-uninitialized in particular is
            # too blunt to want. Warnings still print here; they just do not
            # fail the build. CFLAGS_EXTRA is appended after -Werror on that
            # line, so it wins.
            #
            # This costs no coverage of this module's own code: the eight
            # other usermod jobs all still build it with -Werror. This row
            # is a build-and-run smoke test for ARM64 Windows, nothing more.
            # Its one real finding so far — this module's own f32 promotion —
            # was fixed properly rather than silenced (src/wasm3_mp.c,
            # WASM3_FLOAT), and the x64/x86 rows keep -Wdouble-promotion
            # active to hold that fixed.
            cflags_extra: "-Wno-error"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          # curl/tar/xz for the fetch step below: this job cannot use
          # .github/actions/fetch-micropython, which shells out to wget and
          # writes a $GITHUB_WORKSPACE (backslash) path into MPY_DIR.
          install: make git python3 curl tar xz ${{ matrix.msys_install }}

      - name: Fetch MicroPython ${{ env.MPY_TAG }}
        # POSIX paths throughout ($(pwd), not $GITHUB_WORKSPACE). MSYS2 bash
        # treats the backslashes in "D:\a\repo\repo" as escape characters
        # and silently eats them, which turns every path built from it into
        # garbage — the failure a7p documented against USER_C_MODULES.
        run: |
          VER="${MPY_TAG#v}"
          curl -fsSL -o mpy.tar.xz \
            "https://github.com/micropython/micropython/releases/download/${MPY_TAG}/micropython-${VER}.tar.xz"
          tar xf mpy.tar.xz && rm mpy.tar.xz
          echo "MPY_DIR=$(pwd)/micropython-${VER}" >> "$GITHUB_ENV"

      - name: Build mpy-cross
        # STRIP=""/SIZE="true" on every arch, not just the one that needs
        # them. py/mkenv.mk defines STRIP/SIZE as $(CROSS_COMPILE)strip and
        # -size unconditionally, and CLANGARM64's gcc-compat package ships
        # neither. STRIP="" works because py/mkrules.mk guards that step with
        # `ifdef STRIP` and Make treats an empty value as undefined; SIZE has
        # no such guard, so it needs a real no-op binary rather than "".
        #
        # LDFLAGS_ARCH: mpy-cross/Makefile hardcodes `--cref` for every
        # non-Darwin host. Fine for GNU ld, but CLANGARM64 links through
        # clang+lld, which rejects it outright. The map file's cross-
        # reference table is diagnostic only.
        #
        # COMPILER_TARGET: mpy-cross/Makefile decides whether to compile
        # ports/windows/fmode.c by grepping `$(CC) -dumpmachine` for
        # "mingw". Real mingw-w64 gcc reports x86_64-w64-mingw32 and matches;
        # CLANGARM64's wrapper is clang underneath and does not, so fmode.c
        # is silently dropped and the link fails on set_fmode_binary. Forcing
        # a value containing "mingw" is correct for all three environments.
        run: |
          make -C "$MPY_DIR/mpy-cross" \
            LDFLAGS_ARCH="-Wl,--gc-sections" COMPILER_TARGET="mingw-forced" \
            STRIP="" SIZE="true" -j"$(nproc)"

      - name: Build usermod firmware (windows-${{ matrix.arch }})
        # CROSS_COMPILE is left empty deliberately: inside an MSYS2
        # environment the toolchain is already the target's, under unprefixed
        # names. That also makes WINDRES (py/mkenv.mk: $(CROSS_COMPILE)windres)
        # resolve to plain `windres`, which gcc-compat does provide — the
        # prefixed aarch64-w64-mingw32-windres is what does not exist.
        run: |
          make -C "$MPY_DIR/ports/windows" \
            BUILD=build-wasm3 PROG=micropython-wasm3.exe \
            STRIP="" SIZE="true" CFLAGS_EXTRA="${{ matrix.cflags_extra }}" \
            USER_C_MODULES="$(pwd)" \
            FROZEN_MANIFEST="$(pwd)/usermod/manifest.py" \
            -j"$(nproc)"

      - name: Run tests
        # Natively, on the box that built it — no emulation anywhere.
        run: |
          cd tests
          EXE="$MPY_DIR/ports/windows/build-wasm3/micropython-wasm3.exe"
          "$EXE" test_wasm3.py
          "$EXE" test_wiring_apps.py --slow

  # ── ports/webassembly: wasm3 compiled to wasm, run under node ─────────────
  # natmod cannot reach this port either — dynruntime.mk has no WASM ARCH, and
  # the mechanism is architecturally different anyway. So, like aarch64,
  # armhf, mipsel and Windows, this is a target usermod is the only route to.
  #
  # It is also the odd one conceptually: an interpreter for wasm, itself
  # compiled to wasm. That is a real configuration — wasm3 upstream supports
  # it — and it turns out to work here unmodified, so it stays as a genuine
  # portability datapoint rather than a curiosity: 32-bit target, a libc that
  # is neither glibc nor newlib, and no filesystem at all.
  usermod-wasm:
    name: build + test (webassembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ballistics-lab/micropython-native-ci/.github/actions/fetch-micropython@main
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          (cd emsdk && ./emsdk install latest && ./emsdk activate latest)

      - name: Build mpy-cross
        run: make -C "$MPY_DIR/mpy-cross"

      - name: Build usermod (webassembly, pyscript variant)
        run: |
          source emsdk/emsdk_env.sh
          make -C "$MPY_DIR/ports/webassembly" VARIANT=pyscript \
            BUILD="$GITHUB_WORKSPACE/usermod/build/wasm" \
            USER_C_MODULES="$GITHUB_WORKSPACE" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py" \
            -j"$(nproc)"

      - name: Run both suites under node
        # Via natmod/ci/run_wasm.py rather than `node micropython.mjs
        # test_wasm3.py` directly: this port gives the interpreter no
        # filesystem, so open() raises OSError 44 for every blob even though
        # node itself read the script off the host. The runner prepends them
        # through the same _INJECTED hook the QEMU runner uses.
        run: |
          python3 natmod/ci/run_wasm.py \
            usermod/build/wasm/micropython.mjs test_wasm3.py
          python3 natmod/ci/run_wasm.py \
            usermod/build/wasm/micropython.mjs test_wiring_apps.py --slow

      - uses: actions/upload-artifact@v4
        with:
          name: wasm3-usermod-webassembly
          path: |
            usermod/build/wasm/micropython.mjs
            usermod/build/wasm/micropython.wasm
          if-no-files-found: error

  # ── ESP32, build-only ────────────────────────────────────────────────────
  # This target was written off in README as "attempted and abandoned",
  # because the ESP-IDF component registry was unreachable from the
  # environment this repo is developed in -- dl.espressif.com and
  # components-file.espressif.com were both refused by its egress policy, and
  # espressif/mdns and espressif/lan867x are real dependencies of the port for
  # target esp32, vendored in neither the release tarball nor esp-idf itself.
  # That was always a statement about one machine rather than about the
  # target, which is why this job was written CI-first and green on the second
  # attempt. Both hosts have since been allowed, so anything further here can
  # be reproduced locally before pushing, the way everything else in this
  # workflow is.
  #
  # Build-only, and not as a shortcut: there is no esp32 emulator to hand a
  # firmware image to the way rp2040py takes an RP2040 .uf2 or qemu-system-arm
  # takes a Cortex-M3 .elf. It proves wasm3 compiles and links into a real
  # esp32 firmware under a compiler, libc and config unlike anything else
  # here. It proves nothing runs.
  #
  # The genuinely open question is size rather than portability. wasm3 is an
  # interpreter, not a leaf module, and a usermod goes into the firmware
  # image -- so this is the first target where the port's flash and IRAM
  # budget is a real constraint on it rather than a footnote. A red result
  # here is informative either way.
  #
  # IDF v5.5.1 is what ports/esp32/README.md names as recommended for this
  # MicroPython release (5.3, 5.4, 5.4.1 and 5.4.2 also supported).
  # BOARD=ESP32_GENERIC is the mainstream target, and the xtensawin one that
  # natmod.yml already builds a .mpy for.
  usermod-esp32:
    name: build (esp32 / ESP32_GENERIC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ballistics-lab/micropython-native-ci/.github/actions/fetch-micropython@main
        with:
          mpy_tag: ${{ env.MPY_TAG }}

      - name: Install esp-idf
        # --recursive, unlike a natmod build of the same ISA: that one only
        # wants the xtensa compiler install.sh downloads, this one compiles
        # into a firmware built against IDF's own components.
        # `install.sh esp32` limits the toolchain download to the one target.
        env:
          IDF_VER: v5.5.1
        run: |
          git clone --depth 1 --recursive --branch "$IDF_VER" \
            https://github.com/espressif/esp-idf.git
          ./esp-idf/install.sh esp32

      - name: Build mpy-cross
        # Before export.sh is sourced anywhere -- mpy-cross is a host tool and
        # has no business being built inside IDF's own python/toolchain
        # environment. Explicit for the usual reason, see the unix job.
        run: make -C "$MPY_DIR/mpy-cross" -j"$(nproc)"

      - name: Build ESP32 firmware
        # USER_C_MODULES points at usermod/micropython.cmake itself: CMake's
        # USER_C_MODULES takes a file, not a directory to glob, unlike the
        # Make-based ports which take this repo's root.
        run: |
          source esp-idf/export.sh
          make -C "$MPY_DIR/ports/esp32" \
            BOARD=ESP32_GENERIC \
            USER_C_MODULES="$GITHUB_WORKSPACE/usermod/micropython.cmake" \
            FROZEN_MANIFEST="$GITHUB_WORKSPACE/usermod/manifest.py"

      - name: Dump the IDF build logs
        if: failure()
        # idf.py redirects the compiler's own stderr into
        # build-*/log/idf_py_stderr_output_<pid> and prints only "ninja failed
        # with exit code 1" to the console, so a failing compile leaves no
        # diagnostic in the Actions log at all -- which is exactly what
        # happened on this job's first run (it stopped in
        # wasm3/source/m3_compile.c with nothing to say why). Surface them.
        #
        # stdout first and short, stderr last and long, deliberately: stdout
        # is ninja's progress spam and stderr is the compiler diagnostic, and
        # a plain `for f in ...std*...` glob expands alphabetically -- stderr
        # then stdout -- which buried the useful half 200 lines above the end
        # of the log on the first attempt at this step.
        #
        # The log files turned out not to carry the diagnostic at all: idf.py's
        # idf_py_stderr_output_* holds only its own bookkeeping ("Command:
        # ninja all"), and the stdout copy of ninja's stream shows the failing
        # target and then "ninja: build stopped" with nothing in between. So
        # dump them for context, then get the real answer by re-running ninja
        # verbosely in the same build directory: everything is already built
        # except the one object that failed, so this recompiles just that and
        # prints both the exact command line and the compiler's own output.
        # `|| true` so this step reports rather than re-failing the job.
        run: |
          BUILD="$MPY_DIR/ports/esp32/build-ESP32_GENERIC"
          for f in "$BUILD"/log/idf_py_std*_output_*; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 60 "$f"
            echo "::endgroup::"
          done
          echo "--- re-running ninja verbosely to surface the diagnostic:"
          source esp-idf/export.sh
          ninja -C "$BUILD" -v -k 0 2>&1 | tail -n 120 || true

      - uses: actions/upload-artifact@v4
        with:
          name: wasm3-usermod-esp32
          path: |
            micropython-*/ports/esp32/build-ESP32_GENERIC/micropython.bin
            micropython-*/ports/esp32/build-ESP32_GENERIC/firmware.bin
          if-no-files-found: error
